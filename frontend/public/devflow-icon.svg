<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Connection lines / workflow graph -->
  <line x1="12" y1="24" x2="21" y2="15" stroke="#356DFF" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  <line x1="12" y1="24" x2="21" y2="33" stroke="#356DFF" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  <line x1="21" y1="15" x2="30" y2="15" stroke="#356DFF" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  <line x1="21" y1="33" x2="30" y2="33" stroke="#356DFF" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  <line x1="30" y1="15" x2="36" y2="24" stroke="#19C6B4" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <line x1="30" y1="33" x2="36" y2="24" stroke="#19C6B4" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <line x1="21" y1="15" x2="24" y2="24" stroke="#356DFF" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <line x1="21" y1="33" x2="24" y2="24" stroke="#356DFF" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>

  <!-- Outer nodes -->
  <circle cx="12" cy="24" r="3.2" fill="#356DFF" opacity="0.9"/>
  <circle cx="21" cy="15" r="2.6" fill="#356DFF" opacity="0.75"/>
  <circle cx="21" cy="33" r="2.6" fill="#356DFF" opacity="0.75"/>
  <circle cx="30" cy="15" r="2.4" fill="#19C6B4" opacity="0.8"/>
  <circle cx="30" cy="33" r="2.4" fill="#19C6B4" opacity="0.8"/>

  <!-- Right teal accent node -->
  <circle cx="36" cy="24" r="3" fill="#19C6B4" opacity="0.9"/>

  <!-- Central circle with checkmark -->
  <circle cx="24" cy="24" r="7" fill="#356DFF"/>
  <circle cx="24" cy="24" r="7" fill="url(#centerGrad)"/>
  <!-- Checkmark -->
  <path d="M20.5 24.2 L23 26.8 L27.5 21.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Right-pointing arrow accent -->
  <path d="M39 22.5 L43 24 L39 25.5" stroke="#356DFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <defs>
    <linearGradient id="centerGrad" x1="17" y1="17" x2="31" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#356DFF"/>
      <stop offset="100%" stop-color="#2252CC"/>
    </linearGradient>
  </defs>
</svg>

